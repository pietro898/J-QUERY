<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<form id="meu-form">
 <input type="text" id="nome" placeholder="Digite seu nome">
 <button type="submit">Enviar</button>
</form>
<p id="mensagem"></p>
<!-- JQUERY -->
<script>
 $(document).ready(function() {
 $('#meu-form').submit(function(event) {
 event.preventDefault();
const valor = $('#nome').val();
if (valor === '') {
 $('#mensagem').text('Por favor, preencha seu nome!').css('color', 'red');
 } else {
 $('#mensagem').text(`Bem-vindo, ${valor}!`).css('color', 'green');
 }
 });
 });
</script>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
</html>
